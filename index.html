<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Losowanie – Paczuszka Radości</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Josefin+Sans:wght@400;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf3ea; --paper:#fffaf4; --gold:#c29a45; --gold-2:#d9b768; --gold-dark:#9c7629;
    --pink:#e6a196; --pink-dark:#c9786c; --ink:#2c2522; --muted:#8b7a6c; --line:#e8d6b4;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(ellipse at top, #fffaf3 0%, var(--cream) 60%) fixed, var(--cream);
    color:var(--ink); font-family:"Josefin Sans", system-ui, sans-serif; font-size:16px; min-height:100vh;
  }
  .top{display:flex; align-items:center; gap:18px; padding-block:18px; padding-left:max(28px, env(safe-area-inset-left, 0px)); padding-right:max(28px, env(safe-area-inset-right, 0px)); border-bottom:1px solid var(--line); background:rgba(255,250,244,.7)}
  .top img{width:72px; height:72px; border-radius:50%; object-fit:cover}
  .top h1{font-family:"Marcellus", serif; font-weight:400; font-size:28px; margin:0; letter-spacing:.5px}
  .top p{margin:2px 0 0; color:var(--gold-dark); letter-spacing:2px; font-size:13px; text-transform:uppercase}
  main{display:grid; grid-template-columns:minmax(300px, 380px) 1fr; gap:24px; padding-block:24px; padding-left:max(28px, env(safe-area-inset-left, 0px)); padding-right:max(28px, env(safe-area-inset-right, 0px)); max-width:1500px; margin:0 auto}
  @media (max-width:900px){ main{grid-template-columns:minmax(0,1fr); padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))} .top{padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))} }
  .panel{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 6px 24px rgba(156,118,41,.08)}
  h2{font-family:"Marcellus", serif; font-weight:400; font-size:20px; margin:0 0 12px; display:flex; align-items:center; gap:10px}
  h2 .badge{font-family:"Josefin Sans"; font-size:13px; background:var(--gold); color:#fff; border-radius:20px; padding:3px 10px 1px}
  .sep{height:1px; background:linear-gradient(90deg, transparent, var(--gold-2), transparent); margin:20px 0}
  input[type=text], textarea, select{
    width:100%; font:inherit; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px 8px; outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(194,154,69,.18)}
  textarea{min-height:110px; resize:vertical}
  .add{display:flex; gap:8px}
  button, .btn{
    font:inherit; font-weight:600; cursor:pointer; border-radius:10px; border:1px solid var(--gold); background:#fff; color:var(--gold-dark);
    padding:10px 16px 8px; transition:transform .08s, box-shadow .15s, background .15s; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;
  }
  button:hover:not(:disabled), .btn:hover{background:#fdf5e6}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:not-allowed}
  .primary{background:linear-gradient(180deg, var(--gold-2), var(--gold)); color:#fff; border-color:var(--gold-dark); box-shadow:0 4px 14px rgba(156,118,41,.25)}
  .primary:hover:not(:disabled){background:linear-gradient(180deg, #e2c27a, var(--gold-dark))}
  .rec{background:linear-gradient(180deg, #eeb2a8, var(--pink-dark)); border-color:#b5675c; box-shadow:0 4px 14px rgba(201,120,108,.3)}
  .rec:hover:not(:disabled){background:linear-gradient(180deg, #e9a497, #b5675c)}
  .big{font-size:18px; padding:14px 26px 12px}
  .small{font-size:13px; padding:7px 12px 5px}
  details{margin-top:10px}
  summary{cursor:pointer; color:var(--gold-dark); font-size:14px; padding:4px 0}
  details textarea{margin:8px 0}
  ul.names{list-style:none; margin:14px 0 0; padding:0; max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:#fff}
  ul.names li{display:flex; align-items:center; gap:10px; padding:8px 10px 6px; border-bottom:1px solid #f3e8d5}
  ul.names li:last-child{border-bottom:none}
  ul.names .no{color:var(--muted); font-size:13px; min-width:26px; text-align:right}
  ul.names .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  ul.names .x{border:none; background:none; color:var(--muted); font-size:18px; padding:2px 8px; line-height:1}
  ul.names .x:hover{color:var(--pink-dark); background:#fdf0ee}
  .empty{padding:18px; text-align:center; color:var(--muted); font-size:14px}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  label.f{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; letter-spacing:.5px; text-transform:uppercase}
  label.chk{display:flex; align-items:center; gap:10px; margin-top:12px; cursor:pointer}
  label.chk input{width:18px; height:18px; accent-color:var(--gold)}
  .stage-col{display:flex; flex-direction:column; gap:16px; min-width:0}
  .stage{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; justify-content:center; align-items:center; box-shadow:0 6px 24px rgba(156,118,41,.08)}
  .stage canvas{display:block; max-width:100%; max-height:70vh; width:auto; height:auto; border-radius:6px; box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .stage:fullscreen{background:#1e1917; border:none; border-radius:0; padding:0}
  .stage:fullscreen canvas{max-height:100vh; max-width:100vw; border-radius:0}
  .actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
  .status{text-align:center; min-height:22px; color:var(--muted)}
  .status.err{color:#b5473a; font-weight:600}
  .status.recording{color:#c0392b; font-weight:600}
  .status.recording::before{content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:#d23a2b; margin-right:8px; animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .result{display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:18px; align-items:start}
  @media (max-width:700px){ .result{grid-template-columns:1fr} }
  .result video{width:100%; max-height:360px; border-radius:10px; background:#000}
  .dl{display:flex; flex-direction:column; gap:10px; min-width:220px}
  .hint{font-size:13px; color:var(--muted); line-height:1.45}
  ol.hist{margin:0; padding-left:22px; max-height:220px; overflow:auto}
  ol.hist li{padding:5px 0 3px; border-bottom:1px dashed #f0e2c8}
  ol.hist li b{font-weight:600}
  ol.hist .meta{color:var(--muted); font-size:13px}
  body.busy .lock{pointer-events:none; opacity:.55}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
  <img id="topLogo" alt="Paczuszka Radości">
  <div>
    <h1>Losowanie</h1>
    <p>Paczuszka Radości · Małe prezenty, wielka radość</p>
  </div>
</header>

<main>
  <section class="panel lock">
    <h2>Uczestnicy <span class="badge" id="count">0</span></h2>
    <form class="add" id="addForm">
      <input type="text" id="nameInput" name="osoba" placeholder="Imię i nazwisko" lang="pl" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <button type="submit" class="primary">Dodaj</button>
    </form>
    <details>
      <summary>Wklej wiele osób naraz</summary>
      <textarea id="bulk" lang="pl" autocapitalize="words" spellcheck="false" placeholder="Jedna osoba w każdej linii, np.&#10;Anna Kowalska&#10;Jan Nowak"></textarea>
      <button type="button" id="bulkAdd" class="small">Dodaj wszystkich</button>
    </details>
    <ul class="names" id="list"></ul>
    <div class="row">
      <button type="button" class="small" id="dedupe">Usuń duplikaty</button>
      <button type="button" class="small" id="shuffle">Wymieszaj</button>
      <button type="button" class="small" id="clear">Wyczyść listę</button>
    </div>

    <div class="sep"></div>
    <h2>Ustawienia</h2>
    <label class="f" for="title">Tytuł losowania</label>
    <input type="text" id="title" lang="pl" spellcheck="false">
    <label class="f" for="format">Format nagrania</label>
    <select id="format">
      <option value="1:1">Kwadrat 1:1 (1080×1080) – post</option>
      <option value="4:5">Pion 4:5 (1080×1350) – post</option>
      <option value="9:16">Pion 9:16 (1080×1920) – rolka / relacja</option>
    </select>
    <label class="f" for="speed">Czas losowania</label>
    <select id="speed">
      <option value="4">Krótki (ok. 4 s)</option>
      <option value="6">Standardowy (ok. 6 s)</option>
      <option value="9">Długi (ok. 9 s)</option>
    </select>
    <label class="chk"><input type="checkbox" id="removeWinner"> Usuń zwycięzcę z listy po losowaniu</label>
    <label class="chk"><input type="checkbox" id="sound"> Dźwięk (także w nagraniu)</label>
  </section>

  <section class="stage-col">
    <div class="stage" id="stage"><canvas id="cv" width="1080" height="1080"></canvas></div>
    <div class="actions">
      <button class="primary big" id="drawBtn">Losuj</button>
      <button class="rec big" id="recBtn">● Losuj i nagraj wideo</button>
      <button class="big" id="fsBtn">Pełny ekran</button>
    </div>
    <div class="status" id="status"></div>

    <div class="panel" id="resultPanel" hidden>
      <h2>Wynik do publikacji</h2>
      <div class="result">
        <div>
          <video id="video" controls playsinline hidden></video>
          <p class="hint" id="noVideo">Losowanie bez nagrania – pobierz grafikę z wynikiem lub użyj „Losuj i nagraj wideo”.</p>
        </div>
        <div class="dl">
          <button type="button" class="primary" id="dlVideo" hidden>Pobierz wideo</button>
          <button type="button" id="dlPng">Pobierz grafikę z wynikiem (PNG)</button>
          <p class="hint" id="fmtHint"></p>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Historia losowań</h2>
      <ol class="hist" id="hist"></ol>
      <div class="empty" id="histEmpty">Brak losowań.</div>
      <div class="row"><button type="button" class="small lock" id="clearHist">Wyczyść historię</button></div>
    </div>
  </section>
</main>

  const $ = s => document.querySelector(s);

  // ---------- Pamięć lokalna ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let names = store.get('pr_names', []);
  let history = store.get('pr_history', []);
  const settings = Object.assign({ title:'Losowanie nagrody', format:'1:1', speed:'6', removeWinner:false, sound:true }, store.get('pr_settings', {}));
  const saveNames = () => store.set('pr_names', names);
  const saveSettings = () => store.set('pr_settings', settings);

  // ---------- Losowość kryptograficzna (uczciwe losowanie) ----------
  function randInt(n){
    const max = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= max);
    return x % n;
  }

  // ---------- Lista uczestników ----------
  const clean = s => String(s || '').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
  function addName(s){ s = clean(s); if (s) names.push(s); return !!s; }
  function renderList(){
    const ul = $('#list'); ul.innerHTML = '';
    $('#count').textContent = names.length;
    if (!names.length){
      const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Dodaj uczestników losowania.'; ul.appendChild(li);
    }
    names.forEach((n, i) => {
      const li = document.createElement('li');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n; nm.title = n;
      const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.title = 'Usuń';
      x.onclick = () => { names.splice(i, 1); saveNames(); renderList(); };
      li.append(no, nm, x); ul.appendChild(li);
    });
    if (mode === 'idle') redraw();
  }
  // Klawiatury Androida (Gboard, Samsung) trzymają ostatnie słowo „w edycji” –
  // czekamy, aż zostanie zatwierdzone, i dopiero wtedy odczytujemy pole.
  const nameInput = $('#nameInput');
  let composing = false;
  nameInput.addEventListener('compositionstart', () => { composing = true; });
  nameInput.addEventListener('compositionend', () => { composing = false; });
  function commitName(){
    const v = nameInput.value;
    if (addName(v)){ saveNames(); renderList(); const ul = $('#list'); ul.scrollTop = ul.scrollHeight; setStatus(''); }
    nameInput.value = '';
  }
  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    if (composing){
      nameInput.blur();                       // wymusza zatwierdzenie tekstu przez klawiaturę
      setTimeout(() => { commitName(); nameInput.focus(); }, 60);
    } else {
      setTimeout(() => { commitName(); nameInput.focus(); }, 0);
    }
  });
  $('#bulkAdd').onclick = () => {
    const lines = $('#bulk').value.split(/\r?\n|;/);
    let c = 0; lines.forEach(l => { if (addName(l)) c++; });
    $('#bulk').value = ''; saveNames(); renderList(); setStatus(c ? `Dodano ${c} os.` : '');
  };
  $('#dedupe').onclick = () => {
    const seen = new Set(), before = names.length;
    names = names.filter(n => { const k = n.toLocaleLowerCase('pl'); if (seen.has(k)) return false; seen.add(k); return true; });
    saveNames(); renderList(); setStatus(`Usunięto duplikaty: ${before - names.length}`);
  };
  $('#shuffle').onclick = () => {
    for (let i = names.length - 1; i > 0; i--){ const j = randInt(i + 1); [names[i], names[j]] = [names[j], names[i]]; }
    saveNames(); renderList();
  };
  $('#clear').onclick = e => { if (names.length && confirmClick(e.currentTarget)){ names = []; saveNames(); setIdle(); renderList(); } };

  // ---------- Ustawienia ----------
  $('#title').value = settings.title;
  $('#format').value = settings.format;
  $('#speed').value = settings.speed;
  $('#removeWinner').checked = settings.removeWinner;
  $('#sound').checked = settings.sound;
  $('#title').addEventListener('input', e => { settings.title = e.target.value; saveSettings(); redraw(); });
  $('#format').addEventListener('change', e => { settings.format = e.target.value; saveSettings(); if (lastResult) lastResult.particles = []; setFormat(); });
  $('#speed').addEventListener('change', e => { settings.speed = e.target.value; saveSettings(); });
  $('#removeWinner').addEventListener('change', e => { settings.removeWinner = e.target.checked; saveSettings(); });
  $('#sound').addEventListener('change', e => { settings.sound = e.target.checked; saveSettings(); if (master) master.gain.value = settings.sound ? 0.9 : 0; });

  function setStatus(t, rec, err){ const s = $('#status'); s.textContent = t || ''; s.classList.toggle('recording', !!rec); s.classList.toggle('err', !!err); }
  // potwierdzenie drugim kliknięciem (bez okienek przeglądarki)
  function confirmClick(btn){
    if (btn.dataset.armed){ clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.textContent = btn.dataset.label; return true; }
    btn.dataset.label = btn.textContent; btn.textContent = 'Na pewno? Kliknij ponownie';
    btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.textContent = btn.dataset.label; }, 3500);
    return false;
  }
  // zapis pliku: w podglądzie claude.ai przez funkcję pobierania, lokalnie zwykłym linkiem
  let dlApi;
  async function saveFile(blob, filename){
    if (dlApi === undefined){
      dlApi = null;
      try { if (window.claude && window.claude.use) dlApi = await window.claude.use('downloads'); } catch(e){ dlApi = null; }
    }
    if (dlApi){
      try { await dlApi.save({ filename, data: blob }); setStatus('Zapisano: ' + filename); }
      catch(e){ if (e && e.code !== 'declined') setStatus('Nie udało się zapisać pliku (' + (e.code || 'błąd') + ').', false, true); }
      return;
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ---------- Historia ----------
  function renderHistory(){
    const ol = $('#hist'); ol.innerHTML = '';
    $('#histEmpty').hidden = history.length > 0;
    history.slice().reverse().forEach(h => {
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = h.name;
      const m = document.createElement('div'); m.className = 'meta';
      const d = new Date(h.date);
      m.textContent = `${h.title || 'Losowanie'} · ${d.toLocaleDateString('pl-PL')} ${d.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'})} · uczestników: ${h.count}`;
      li.append(b, m); ol.appendChild(li);
    });
  }
  $('#clearHist').onclick = e => { if (history.length && confirmClick(e.currentTarget)){ history = []; store.set('pr_history', history); renderHistory(); } };

  // ---------- Grafika (canvas) ----------
  const FORMATS = { '1:1':[1080,1080], '4:5':[1080,1350], '9:16':[1080,1920] };
  const C = { gold:'#c29a45', gold2:'#dcbc72', goldDark:'#9c7629', ink:'#2c2522', muted:'#93806f', pink:'#e6a196', pinkDark:'#c9786c' };
  const F = { script:'"Dancing Script", "Brush Script MT", cursive', serif:'"Marcellus", Georgia, serif', sans:'"Josefin Sans", "Helvetica Neue", Arial, sans-serif' };
  const cv = $('#cv'), ctx = cv.getContext('2d');
  let W = 1080, H = 1080, L = {};
  let BG = '#fcf3e9';
  const logoImg = new Image();
  logoImg.onload = () => {
    try { // dopasowanie tła do koloru logotypu
      const t = document.createElement('canvas'); t.width = t.height = 8;
      const tc = t.getContext('2d'); tc.drawImage(logoImg, 0, 0, 30, 30, 0, 0, 8, 8);
      const d = tc.getImageData(1, 1, 1, 1).data; BG = `rgb(${d[0]},${d[1]},${d[2]})`;
    } catch(e){}
    redraw();
  };
  logoImg.src = LOGO;
  $('#topLogo').src = LOGO;

  function layout(){
    const o = {};
    o.pad = 34;
    o.logoD = Math.min(W * 0.40, H * 0.30);
    o.logoCx = W / 2;
    o.logoCy = o.pad + 40 + o.logoD / 2 + (H > 1400 ? 40 : 0);
    o.titleY = o.logoCy + o.logoD / 2 + 64;
    o.divY = o.titleY + 44;
    o.footY = H - o.pad - 42;
    const avail = o.footY - 40 - o.divY;
    o.slotCy = o.divY + 20 + avail / 2;
    o.slotH = Math.min(W * 0.26, avail * 0.6);
    o.itemH = o.slotH * 0.5;
    o.boxW = W * 0.80;
    return o;
  }
  function setFormat(){
    [W, H] = FORMATS[settings.format] || FORMATS['1:1'];
    cv.width = W; cv.height = H; L = layout(); redraw();
  }

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  function heart(x, y, s, color){
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.38);
    ctx.bezierCurveTo(x - s * 0.62, y - s * 0.02, x - s * 0.36, y - s * 0.58, x, y - s * 0.22);
    ctx.bezierCurveTo(x + s * 0.36, y - s * 0.58, x + s * 0.62, y - s * 0.02, x, y + s * 0.38);
    ctx.fillStyle = color; ctx.fill();
  }
  function divider(cx, y, half, hs = 22){
    const g = ctx.createLinearGradient(cx - half, 0, cx + half, 0);
    g.addColorStop(0, 'rgba(194,154,69,0)'); g.addColorStop(.5, C.gold); g.addColorStop(1, 'rgba(194,154,69,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(cx - half, y); ctx.lineTo(cx - hs, y); ctx.moveTo(cx + hs, y); ctx.lineTo(cx + half, y); ctx.stroke();
    heart(cx, y + 2, hs, C.gold);
  }
  function fitSize(text, family, max, maxW, weight = ''){
    ctx.font = `${weight} ${max}px ${family}`;
    const w = ctx.measureText(text).width;
    return w > maxW ? Math.max(18, Math.floor(max * maxW / w)) : max;
  }
  function spaced(text, cx, y, spacing){
    const chars = [...text]; const ws = chars.map(c => ctx.measureText(c).width);
    let x = cx - (ws.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1)) / 2;
    ctx.textAlign = 'left';
    chars.forEach((c, i) => { ctx.fillText(c, x, y); x += ws[i] + spacing; });
    ctx.textAlign = 'center';
    return x;
  }
  function roundRect(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawBase(){
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,253,248,.7)'); g.addColorStop(1, 'rgba(240,222,196,.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // ramka
    ctx.strokeStyle = C.gold; ctx.lineWidth = 3.5; ctx.strokeRect(L.pad, L.pad, W - 2 * L.pad, H - 2 * L.pad);
    ctx.strokeStyle = 'rgba(194,154,69,.4)'; ctx.lineWidth = 1.2; ctx.strokeRect(L.pad + 10, L.pad + 10, W - 2 * L.pad - 20, H - 2 * L.pad - 20);
    // logotyp
    if (logoImg.complete && logoImg.naturalWidth){
      const r = L.logoD / 2, sr = logoImg.naturalWidth * 0.477, sc = logoImg.naturalWidth / 2;
      ctx.save(); ctx.beginPath(); ctx.arc(L.logoCx, L.logoCy, r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(logoImg, sc - sr, sc - sr, sr * 2, sr * 2, L.logoCx - r, L.logoCy - r, r * 2, r * 2);
      ctx.restore();
    }
    // tytuł
    const title = clean(settings.title || '') || 'Losowanie';
    ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `${fitSize(title, F.serif, 54, W * 0.8)}px ${F.serif}`;
    ctx.fillText(title, W / 2, L.titleY);
    divider(W / 2, L.divY, W * 0.25);
    // stopka
    const d = new Date();
    ctx.fillStyle = C.muted; ctx.font = `600 24px ${F.sans}`; ctx.textBaseline = 'middle';
    const count = anim ? anim.count : (mode === 'result' && lastResult ? lastResult.count : names.length);
    spaced(`UCZESTNIKÓW: ${count}   ·   ${d.toLocaleDateString('pl-PL')}`, W / 2, L.footY, 3);
  }

  function drawBox(glow = 0){
    const bw = L.boxW, bh = L.itemH * 1.2, x = (W - bw) / 2, y = L.slotCy - bh / 2;
    ctx.save();
    ctx.shadowColor = `rgba(194,154,69,${0.25 + glow * 0.5})`; ctx.shadowBlur = 24 + glow * 30;
    roundRect(x, y, bw, bh, 18); ctx.fillStyle = 'rgba(255,253,249,.9)'; ctx.fill();
    ctx.restore();
    roundRect(x, y, bw, bh, 18); ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.stroke();
    // wskaźniki
    heart(x - 30, L.slotCy + 3, 30, C.pink);
    heart(x + bw + 30, L.slotCy + 3, 30, C.pink);
  }

  function drawReelText(text, y, alpha, emphasize){
    const size = fitSize(text, F.script, Math.round(L.itemH * 0.66), L.boxW - 70, '700');
    ctx.font = `700 ${size}px ${F.script}`;
    ctx.globalAlpha = alpha; ctx.fillStyle = emphasize ? C.ink : '#5a4c44';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2, y + size * 0.04);
    ctx.globalAlpha = 1;
  }

  function drawIdle(){
    drawBox(0);
    ctx.fillStyle = C.goldDark; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = names.length ? 'Kto wygra?' : 'Dodaj uczestników';
    ctx.font = `700 ${Math.round(L.itemH * 0.62)}px ${F.script}`;
    ctx.fillText(txt, W / 2, L.slotCy + 4);
  }

  function drawCountdown(t){
    drawBox(0);
    const i = Math.floor(t / 0.8), k = (t % 0.8) / 0.8;
    const n = 3 - i; if (n < 1) return;
    const s = 1.5 - 0.5 * easeOut(clamp(k / 0.5));
    ctx.save(); ctx.translate(W / 2, L.slotCy + 4); ctx.scale(s, s);
    ctx.globalAlpha = 1 - clamp((k - 0.75) / 0.25);
    ctx.fillStyle = C.gold; ctx.font = `${Math.round(L.itemH * 0.9)}px ${F.serif}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(n), 0, 0);
    ctx.restore();
  }

  function reelPos(x){ return (anim.reel.length - 1) * (1 - Math.pow(1 - x, 3.4)); }
  function drawSpin(t){
    const x = clamp(t / anim.spin), p = reelPos(x);
    drawBox(0);
    const top = L.slotCy - L.itemH * 1.6, bot = L.slotCy + L.itemH * 1.6;
    ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bot - top); ctx.clip();
    const base = Math.floor(p);
    for (let i = base - 2; i <= base + 3; i++){
      if (i < 0 || i >= anim.reel.length) continue;
      const off = i - p, a = clamp(1 - Math.abs(off) / 1.6);
      if (a <= 0) continue;
      drawReelText(anim.reel[i], L.slotCy + off * L.itemH, Math.abs(off) < 0.5 ? 1 : a * 0.75, Math.abs(off) < 0.5);
    }
    ctx.restore();
    const idx = Math.round(p);
    if (idx !== anim.lastIdx){ anim.lastIdx = idx; sfx.tick(); }
  }

  // konfetti
  const PALETTE = ['#c29a45', '#dcbc72', '#e6a196', '#f2c4bb', '#c9786c', '#f6e3b5'];
  function spawn(n, burst){
    for (let i = 0; i < n; i++){
      anim.particles.push({
        x: burst ? W / 2 + (Math.random() - .5) * W * 0.3 : Math.random() * W,
        y: burst ? L.slotCy : -30 - Math.random() * 80,
        vx: burst ? (Math.random() - .5) * 1400 : (Math.random() - .5) * 80,
        vy: burst ? -500 - Math.random() * 900 : 120 + Math.random() * 160,
        r: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * 8,
        s: 14 + Math.random() * 18, c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        k: Math.random() < 0.45 ? 'h' : (Math.random() < 0.6 ? 'r' : 'c')
      });
    }
  }
  function drawParticles(list, dt){
    for (const p of list){
      if (dt){
        p.vy += 900 * dt; p.vx *= (1 - 1.6 * dt); p.vy = Math.min(p.vy, 260 + p.s * 6);
        p.x += p.vx * dt + Math.sin(p.r * 2) * 0.6; p.y += p.vy * dt; p.r += p.vr * dt;
      }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.k === 'h'){ heart(0, 0, p.s * 1.2, p.c); }
      else if (p.k === 'r'){ ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 5, p.s, p.s / 2.5); }
      else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(0, 0, p.s / 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }

  function drawReveal(r, winner, particles, dt){
    const e = clamp(r / 0.8);
    // poświata
    const g = ctx.createRadialGradient(W / 2, L.slotCy, 10, W / 2, L.slotCy, W * 0.55);
    g.addColorStop(0, `rgba(242,196,187,${0.45 * e})`); g.addColorStop(1, 'rgba(242,196,187,0)');
    ctx.fillStyle = g; ctx.fillRect(0, L.divY + 10, W, L.footY - L.divY - 70);
    // „ZWYCIĘZCA”
    const labY = L.slotCy - L.itemH * 1.15;
    ctx.globalAlpha = clamp(r / 0.5);
    ctx.fillStyle = C.gold; ctx.font = `600 34px ${F.sans}`; ctx.textBaseline = 'middle';
    spaced('ZWYCIĘZCA', W / 2, labY, 9);
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W / 2 - 260, labY - 2); ctx.lineTo(W / 2 - 160, labY - 2); ctx.moveTo(W / 2 + 160, labY - 2); ctx.lineTo(W / 2 + 260, labY - 2); ctx.stroke();
    ctx.globalAlpha = 1;
    // imię i nazwisko
    const sc = r >= 0.8 ? 1 : 0.55 + 0.45 * easeOutBack(clamp(r / 0.8));
    const size = fitSize(winner, F.script, Math.round(L.itemH * 0.95), W * 0.82, '700');
    ctx.save(); ctx.translate(W / 2, L.slotCy + 6); ctx.scale(sc, sc);
    ctx.font = `700 ${size}px ${F.script}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(156,118,41,.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
    ctx.fillStyle = C.ink; ctx.fillText(winner, 0, 0);
    ctx.restore();
    // gratulacje
    const a2 = clamp((r - 0.6) / 0.6);
    ctx.globalAlpha = a2;
    divider(W / 2, L.slotCy + L.itemH * 0.85, W * 0.3, 24);
    ctx.fillStyle = C.goldDark; ctx.font = `${Math.round(L.itemH * 0.36)}px ${F.serif}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Gratulacje!', W / 2, L.slotCy + L.itemH * 1.38);
    ctx.globalAlpha = 1;
    drawParticles(particles, dt);
  }

  // ---------- Stan i pętla animacji ----------
  let mode = 'idle';           // idle | anim | result
  let anim = null, lastResult = null, lastFrame = 0;

  function redraw(){ if (mode !== 'anim') drawStatic(); }
  function drawStatic(){
    if (!L.pad) L = layout();
    drawBase();
    if (mode === 'result' && lastResult) drawReveal(10, lastResult.winner, lastResult.particles || [], 0);
    else drawIdle();
  }
  function setIdle(){ mode = 'idle'; redraw(); }

  const PRE = 0.6, CD = 2.4, REVEAL = 5.5;
  function frame(now){
    const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016); lastFrame = now;
    const t = (now - anim.t0) / 1000;
    drawBase();
    if (t < PRE) drawIdle();
    else if (t < PRE + CD){
      const ct = t - PRE, n = Math.floor(ct / 0.8);
      if (n !== anim.cdN){ anim.cdN = n; sfx.beep(n === 2 ? 880 : 660); }
      drawCountdown(ct);
    }
    else if (t < PRE + CD + anim.spin) drawSpin(t - PRE - CD);
    else {
      const r = t - PRE - CD - anim.spin;
      if (!anim.revealed){ anim.revealed = true; spawn(110, true); sfx.fanfare(); }
      if (r < REVEAL - 1.2) spawn(Math.random() < dt * 30 ? 1 : 0, false);
      anim.particles = anim.particles.filter(p => p.y < H + 60);
      drawReveal(r, anim.winner, anim.particles, dt);
      if (r >= REVEAL){ finish(); return; }
    }
    requestAnimationFrame(frame);
  }

  // ---------- Dźwięk ----------
  let ac = null, master = null, audioDest = null;
  function ensureAudio(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = settings.sound ? 0.9 : 0;
      master.connect(ac.destination);
      if (ac.createMediaStreamDestination){ audioDest = ac.createMediaStreamDestination(); master.connect(audioDest); }
    } catch(e){ ac = null; }
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.2){
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(master); o.start(start); o.stop(start + dur + 0.05);
  }
  const sfx = {
    tick(){ if (ac) tone(1500, ac.currentTime, 0.045, 'triangle', 0.12); },
    beep(f){ if (ac) tone(f, ac.currentTime, 0.25, 'sine', 0.22); },
    fanfare(){
      if (!ac) return; const t = ac.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.11, i === 3 ? 1.1 : 0.22, 'triangle', 0.2));
      [1318.5, 1567.98, 2093].forEach((f, i) => tone(f, t + 0.5 + i * 0.08, 0.5, 'sine', 0.06));
    }
  };

  // ---------- Nagrywanie ----------
  let recorder = null, chunks = [], recMime = '', videoUrl = null, pngBlob = null, pngName = '', videoBlob = null, videoName = '', wakeLock = null;
  function pickMime(){
    if (!window.MediaRecorder) return null;
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch(e){} }
    return '';
  }
  function startRecording(){
    const mime = pickMime();
    if (mime === null || !cv.captureStream){ setStatus('Ta przeglądarka nie nagrywa wideo. Użyj aktualnego Chrome, Edge lub Safari.', false, true); return false; }
    const stream = cv.captureStream(30);
    if (audioDest && settings.sound) audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    chunks = [];
    try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8000000 } : { videoBitsPerSecond: 8000000 }); }
    catch(e){ recorder = new MediaRecorder(stream); }
    recMime = recorder.mimeType || mime || 'video/webm';
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.start(500);
    return true;
  }
  function stopRecording(){
    return new Promise(res => {
      if (!recorder || recorder.state === 'inactive') return res(null);
      recorder.onstop = () => {
        const type = recMime.split(';')[0];
        res(new Blob(chunks, { type }));
        recorder.stream.getVideoTracks().forEach(t => t.stop());
        recorder = null;
      };
      recorder.stop();
    });
  }

  // ---------- Losowanie ----------
  const fileStamp = d => {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  };
  function lockUI(on){
    document.body.classList.toggle('busy', on);
    ['#drawBtn', '#recBtn'].forEach(s => $(s).disabled = on);
    document.querySelectorAll('.lock input, .lock select, .lock button, .lock textarea').forEach(el => el.disabled = on);
  }

  async function startDraw(record){
    if (mode === 'anim') return;
    if (names.length < 1){ setStatus('Dodaj co najmniej jednego uczestnika.', false, true); return; }
    ensureAudio();
    await loadFonts();
    const idx = randInt(names.length), winner = names[idx];
    const spin = parseFloat(settings.speed) || 6;
    const len = Math.round(22 + spin * 7);
    const reel = [];
    for (let i = 0; i < len - 1; i++){
      let n = names[Math.floor(Math.random() * names.length)];
      if (names.length > 1){ let guard = 0; while ((n === reel[i - 1] || (i >= len - 3 && n === winner)) && guard++ < 20) n = names[Math.floor(Math.random() * names.length)]; }
      reel.push(n);
    }
    reel.push(winner);
    if (record && !startRecording()) return;
    lockUI(true);
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){ wakeLock = null; }
    setStatus(record ? 'Nagrywanie losowania…' : 'Losowanie…', record);
    $('#resultPanel').hidden = true;
    anim = { t0: performance.now(), spin, reel, winner, idx, count: names.length, lastIdx: -1, cdN: -1, particles: [], revealed: false, record, date: new Date() };
    mode = 'anim'; lastFrame = performance.now();
    requestAnimationFrame(frame);
  }

  async function finish(){
    const a = anim;
    lastResult = { winner: a.winner, count: a.count, particles: a.particles.map(p => Object.assign({}, p)) };
    mode = 'result'; anim = null;
    drawStatic();
    // PNG
    pngBlob = await new Promise(r => cv.toBlob(r, 'image/png'));
    pngName = `paczuszka-radosci-wynik_${fileStamp(a.date)}.png`;
    if (wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
    // wideo
    const v = $('#video'), dlV = $('#dlVideo');
    if (a.record){
      await new Promise(r => setTimeout(r, 400)); // ostatnie klatki
      const blob = await stopRecording();
      if (blob && blob.size){
        if (videoUrl) URL.revokeObjectURL(videoUrl);
        videoUrl = URL.createObjectURL(blob);
        const ext = /mp4/.test(blob.type) ? 'mp4' : 'webm';
        v.src = videoUrl; v.hidden = false; $('#noVideo').hidden = true;
        videoBlob = blob; videoName = `paczuszka-radosci-losowanie_${fileStamp(a.date)}.${ext}`; dlV.hidden = false;
        dlV.textContent = `Pobierz wideo (.${ext})`;
        $('#fmtHint').textContent = ext === 'mp4'
          ? 'Plik MP4 – gotowy do wrzucenia na Facebooka.'
          : 'Plik WebM – Facebook go przyjmuje. Jeśli wolisz MP4, nagraj w Safari lub nowym Chrome / Edge.';
      }
    } else {
      v.hidden = true; v.removeAttribute('src'); dlV.hidden = true; $('#noVideo').hidden = false; $('#fmtHint').textContent = '';
    }
    $('#resultPanel').hidden = false;
    // historia + ewentualne usunięcie zwycięzcy
    history.push({ name: a.winner, date: a.date.toISOString(), count: a.count, title: clean(settings.title || '') });
    store.set('pr_history', history); renderHistory();
    if (settings.removeWinner && names[a.idx] === a.winner){ names.splice(a.idx, 1); saveNames(); }
    lockUI(false); renderList();
    setStatus(`Zwycięzca: ${a.winner}`);
  }

  $('#dlPng').onclick = () => { if (pngBlob) saveFile(pngBlob, pngName); };
  $('#dlVideo').onclick = () => { if (videoBlob) saveFile(videoBlob, videoName); };
  $('#drawBtn').onclick = () => startDraw(false);
  $('#recBtn').onclick = () => startDraw(true);
  $('#fsBtn').onclick = () => {
    const s = $('#stage');
    if (document.fullscreenElement) document.exitFullscreen();
    else (s.requestFullscreen || s.webkitRequestFullscreen || (() => {})).call(s);
  };

  // ---------- Start ----------
  // ładujemy także polskie znaki (osobny zestaw znaków w Google Fonts)
  const PL = 'AaĄąĆćĘęŁłŃńÓóŚśŹźŻż0123456789';
  function loadFonts(){
    if (!document.fonts) return Promise.resolve();
    const all = [`700 60px ${F.script}`, `40px ${F.serif}`, `600 24px ${F.sans}`].map(f => document.fonts.load(f, PL + names.join('')).catch(() => {}));
    return Promise.race([Promise.all(all), new Promise(r => setTimeout(r, 2500))]);
  }
  setFormat(); renderList(); renderHistory();
  loadFonts().then(redraw);
  if (document.fonts) document.fonts.ready.then(redraw);
})();
</script>
</body>
</html>
